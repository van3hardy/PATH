name: Tests

on:
  pull_request:
    branches: [main]

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      # The honest suite. tests/helpers.mjs `fail()` sets process.exitCode, so a
      # failing assertion makes node --test exit non-zero — no silent false greens.
      - name: Test suite (node --test glob)
        run: node --test "tests/**/*.test.mjs" "test/**/*.test.mjs"
      # node's test-runner glob misses the fork-local suites under tests/path-*,
      # tests/shell-discovery and test/* (observed on Windows and Linux). They are
      # enumerated explicitly so CI actually runs them.
      - name: Test suite (fork-local, enumerated)
        run: node --test test/cover-resolver.test.mjs test/cv-templates.test.mjs test/pipeline-lock.test.mjs test/profile-photo.test.mjs test/zh-minimal-template.test.mjs tests/shell-discovery.test.mjs "tests/path-safety/*.test.mjs" "tests/path-brain/*.test.mjs" "tests/path-runner/*.test.mjs" "tests/path-memory/*.test.mjs" "tests/path-workflows/recruiter/*.test.mjs" "tests/path-cli/*.test.mjs"
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
