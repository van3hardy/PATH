name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
      # Linux runners can create symlinks, so the symlink-rejection tests that
      # skip on Windows (EPERM) actually execute here.
      - name: Path safety tests
        run: npm run test:path-safety
      - name: Path agent tests
        run: npm run test:path-agent
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
